projects:
  title: 项目经验
  assignments:
  - title: 无人驾驶的道路风险区域预测模型研究
    tagline: |
      **成果：** 顶会（IROS 2025）已录用《DPGP: A Hybrid 2D-3D Dual Path Potential Ghost Probe Zone Prediction Framework for Safe Autonomous Driving》。  
      **背景：** 实现无人驾驶场景下对潜在“Ghost Probe Zone”（遮挡盲区突发风险区域）的精准建模。  
      **工作内容：**  
      - 定义任务与数据：基于自采与 KITTI 数据集，标注道路风险区域边界，采用高斯模糊热力图生成 soft label。  
      - 模型提出：提出 DPGP (Dual Path Ghost Probe) 框架，设计多模态特征融合模块，有效整合 2D 语义信息（RGB + 梯度图）与 3D 几何信息（激光雷达点云），显著解决了视觉感知在深度估计上的不足。
      - 结果：以 YOLOv8、RT-DETRv2 等主流检测器为基线进行对比，并通过消融实验验证各模态贡献。最终模型在测试集上达到 F1-Score 0.9446（Recall 0.9150, Precision 0.9761），在遮挡风险预测任务上显著优于纯视觉基线模型。
  - title: 基于 LLM 物理知识蒸馏的组件级灵巧抓取生成网络
    tagline: |
      **背景：** 现有灵巧抓取多局限于几何视觉，因缺乏物理语义先验，难以实现对易碎部件的安全操作。本项目旨在填补物理数据稀缺空白，实现几何-物理融合的无损抓取。  
      **工作内容：**  
      - 数据管线： 针对现有抓取数据集缺乏物理属性的问题，设计基于 LLM (DeepSeek) 的物理常识蒸馏管线，自动化生成并校验组件级物理属性（摩擦、密度、脆性），设计梯度差约束算法清洗数据，产出 10k+ 条高质量物理增强样本，为模型提供物理先验支撑。
      - 多尺度语义感知： 基于 PartSLIP 的由粗到细零件分割方案。设计双流 Transformer 编码器，将自然语言指令与组件物理描述映射为统一语义空间，实现了“整物体-部件-物理属性”的多层次对齐。
      - 物理一致性生成策略：提出“几何-物理联合条件扩散模型”。利用 PointNet++ 提取多尺度点云特征，通过 FiLM 和 Cross-Attention 机制融合物理材质嵌入，显式引入摩擦力与脆性约束，有效避免了对易碎部件的暴力抓取。
      - 仿真验证： 在物理仿真环境（ Isaac Gym）中部署测试，目标部件接触准确率达到98.9%，仿真抓取成功率约 88%，平均接触渗透深度控制在 0.7 mm 以内。
  - title: 基于多智能体强化学习（MARL）的城市路网信号协同控制系统
    tagline: |
      **背景：** 构建基于多智能体强化学习（MARL）的自适应信号控制方案，旨在提升路网整体通行效率。  
      **工作内容：**  
      - MDP 构建：将多路口信号配时形式化为带时空依赖的马尔可夫决策过程（MDP），设计包含车道排队长度、车流方向、相位剩余时间及下游剩余容量的高维状态空间，动作定义为相位切换与绿灯时长联合控制，为后续策略学习提供统一的决策接口。
      - 奖励函数改进：针对传统 MaxPressure 在下游车道饱和时易产生“死锁”和排队溢出（Spillover）的问题，提出基于出口剩余容量的改进奖励设计：引入“进入流量 × 出口权重”机制，在提升吞吐量的同时显式惩罚下游拥堵。
      - 多智能体协同控制算法：将每个路口建模为独立智能体，构建基于 DQN 的多智能体协同控制框架，并系统对比 Double DQN、Dueling DQN 及 PPO 等算法在复杂路网下的收敛速度与策略稳定性差异，最终选定性能最优的模型作为核心控制策略。
      - 仿真系统搭建：基于 CityFlow 搭建多种典型城市路网仿真环境，覆盖轻载 / 中载 / 高载交通流场景；与 FixedTime、MaxPressure、PressLight、CoLight 等主流方法对比，基于平均旅行时间、车辆吞吐量与平均排队长度等指标进行评估，实验表明，在相较基线，平均旅行时间降低约 19%，车辆吞吐量提升约 19%，在高拥堵场景下仍保持较高鲁棒性。
  
  - title: 华为昇腾开源社区生态建设（鼎桥）
    tagline: |
      **工作内容：**  
      - 负责华为昇腾开源社区项目中开源模型在昇腾平台的迁移、训练与推理部署，完成端到端代码开发与性能验证。 
      - 基于 Ascend310/910 系列芯片构建高性能推理流水线，涵盖模型加载、调度、算子优化分析与运行耗时分析，保障对标源模型的精度一致性与性能提升。
      - 使用 Ascend-PyTorch / MindSpore 框架将开源 PyTorch 模型移植到昇腾 NPU（910），实现训练与部署，系统性对比源模型的精度与吞吐/延迟指标。
      - 编写可复现的 benchmark 脚本与性能测试套件，采集并分析关键性能指标（如：平均推理延迟、吞吐量、NPU 利用率），输出优化建议
      - 撰写高质量 README 和使用文档，包含一键部署、训练/推理流水、性能对比结果和复现步骤，提升社区可用性与贡献者采纳率。
  - title: Linux 开发环境与集群实战
    tagline: |
      **工作内容：**  
      - 环境构建与容器化：熟练掌握 Linux (Ubuntu/CentOS) 常用命令及 Shell 脚本自动化；精通 Docker 容器操作（挂载、映射），能够排查 CUDA 版本不匹配、LD_LIBRARY_PATH 动态库缺失等环境依赖问题。
      - 任务管理与监控：习惯在 Headless 服务器通过 SSH + Tmux/Screen 管理长期训练任务；熟练使用 nvidia-smi、htop 监控资源。
      - 数据与日志处理：能够利用 grep/awk/sed 管道流高效处理 GB 级日志；善用软链接（ln -s）管理大规模数据集，合理配置用户权限（chmod/chown）以适应多租户集群环境。
      - 远程开发调试：熟练使用 SSH 端口转发（Tunneling）实现本地访问远程 TensorBoard/Vscode；掌握 Vim 编辑器，可在无图形界面下高效完成代码修改与配置。

  - title: 论文复现能力
    tagline: |
      **论文复现案例：**（未开源，仅通过阅读论文完成复现）
      - 《TempT: Temporal consistency for Test-time adaptation》
      - 《BVINet: Unlocking Blind Video Inpainting with Zero Annotations》
      - 《Point Linking Network for Object》
      - 《Exploring emotional aspects of travel concepts via travel photos based on contrastive language-image pretraining》
      - 《Temporally Distributed Networks for Fast Video Semantic Segmentation》
      
      **复现思路说明：**
      - 阅读原始论文与其引用的参考文献（未开源的模型常常结构中，参考了引用文献的模型结构），梳理模型方法架构、创新点结构和数学公式；
      - 分析所用数据集及预处理流程，复现输入格式与训练/测试管道；
      - 还原关键模块的实现逻辑，遵循原文超参与损失设计；
      - 构建评价体系，使用论文相同的指标对比复现结果与原始结果，进行误差分析与复现差距定位；
      - 设计可复用的代码框架，封装数据加载、模型、训练/推理与评估模块，保证可复现性与可扩展性；
      - 记录复现过程中遇到的假设偏差与实现差异，做出合理改进或补充实验以验证方法可行性。
